# Veille automatique de la session « Hyprland (Maison) » (lancé par maison.lua).
# Pas de mise en veille de la machine : téléchargements et jeux continuent.
general {
    lock_cmd = qs -c shell-maison ipc call lock lock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

listener {
    timeout = 900
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}
