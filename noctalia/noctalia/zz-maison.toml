# Config de Noctalia pour la session « Hyprland (Maison) » (NOCTALIA_CONFIG_HOME, ~/.config/uwsm/env-maison).
# Noctalia fusionne tous les .toml de ce dossier par ordre alphabétique : config.toml (lien vers la vraie
# config), puis ce fichier, qui coupe ce que shell-maison remplace. settings.toml (réglages de l'interface)
# l'emporte encore sur les deux, mais ne contient aucune de ces clés.

# Barre : Bar.qml
[bar.default]
enabled = false

# Notifications : Notifs.qml tient le service
[notification]
enable_daemon = false

# Fenêtre de mot de passe (pkexec) : Polkit.qml
[shell]
polkit_agent = false

# Fond d'écran et couleurs : bin/fond (awww + matugen, couleurs/matugen.toml)
[wallpaper]
enabled = false

# Attention : couper ces modèles pendant que Noctalia tourne lance leurs undo_hook (retirent le thème
# « noctalia » des configs Ghostty, btop, cava, GTK). Au démarrage, rien n'est annulé. Réparer :
# bash /usr/share/noctalia/assets/templates/{ghostty,btop,cava}/apply.sh ; …/gtk/apply.sh dark
[theme.templates]
enable_builtin_templates = false
enable_community_templates = false

# Modèles perso de config.toml : sorties détournées vers un dossier ignoré, matugen écrit les vraies
[theme.templates.user.hyprland_borders]
output_path = "$XDG_CACHE_HOME/shell-maison/noctalia-ignore/hyprland-borders.lua"
post_hook = "true"

[theme.templates.user.niri_borders]
output_path = "$XDG_CACHE_HOME/shell-maison/noctalia-ignore/niri-borders.kdl"

[theme.templates.user.menu_colors]
output_path = "$XDG_CACHE_HOME/shell-maison/noctalia-ignore/menu-colors.json"

[theme.templates.user.startpage_colors]
output_path = "$XDG_CACHE_HOME/shell-maison/noctalia-ignore/startpage-colors.css"
