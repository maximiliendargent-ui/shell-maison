# Couleurs tirées du fond d'écran (matugen, lancé par bin/fond) : remplace les modèles de Noctalia.
# Modèles copiés de Noctalia (intégrés, communautaires et perso), couleurs de terminal remplacées par leurs
# équivalents Material. Mêmes fichiers de sortie que Noctalia : les sessions Noctalia et KDE s'en servent aussi.

[config]

# Applis

[templates.ghostty]
input_path = "modeles/ghostty"
output_path = "~/.config/ghostty/themes/noctalia"
post_hook = "pkill -USR2 -x ghostty"

[templates.btop]
input_path = "modeles/btop.theme"
output_path = "~/.config/btop/themes/noctalia.theme"

[templates.cava]
input_path = "modeles/cava.ini"
output_path = "~/.config/cava/themes/noctalia"

[templates.gtk3]
input_path = "modeles/gtk3.css"
output_path = "~/.config/gtk-3.0/noctalia.css"

[templates.gtk4]
input_path = "modeles/gtk4.css"
output_path = "~/.config/gtk-4.0/noctalia.css"

# plasma-apply-colorscheme ne réapplique pas le schéma déjà actif : passage par Breeze pour forcer
[templates.kde]
input_path = "modeles/kcolorscheme.colors"
output_path = "~/.local/share/color-schemes/noctalia.colors"
post_hook = "plasma-apply-colorscheme BreezeDark >/dev/null; plasma-apply-colorscheme noctalia >/dev/null"

[templates.qt5]
input_path = "modeles/qtct.conf"
output_path = "~/.config/qt5ct/colors/noctalia.conf"

[templates.qt6]
input_path = "modeles/qtct.conf"
output_path = "~/.config/qt6ct/colors/noctalia.conf"

[templates.vscode]
input_path = "modeles/vscode.json"
output_path = "~/.vscode/extensions/noctalia.noctaliatheme-0.0.5/themes/NoctaliaTheme-color-theme.json"

[templates.zen_chrome]
input_path = "modeles/zen-userChrome.css"
output_path = "~/.cache/noctalia/zen-browser/zen-userChrome.css"

[templates.zen_content]
input_path = "modeles/zen-userContent.css"
output_path = "~/.cache/noctalia/zen-browser/zen-userContent.css"

[templates.pywalfox]
input_path = "modeles/pywalfox.json"
output_path = "~/.cache/wal/colors.json"
post_hook = "pywalfox update"

[templates.vesktop_midnight]
input_path = "modeles/discord-midnight.css"
output_path = "~/.config/vesktop/themes/noctalia.theme.css"

[templates.vesktop_material]
input_path = "modeles/discord-material.css"
output_path = "~/.config/vesktop/themes/noctalia-material.theme.css"

[templates.vesktop_system24]
input_path = "modeles/discord-system24.css"
output_path = "~/.config/vesktop/themes/discord-system24.css"

# Dossiers Papirus : teinte la plus proche du fond (script repris du modèle communautaire)
[templates.papirus]
input_path = "papirus/colors"
output_path = "~/Projects/shell-maison/couleurs/papirus/colors-final"
post_hook = "bash ~/Projects/shell-maison/couleurs/papirus/apply.sh"

# Bureau

[templates.hyprland_borders]
input_path = "modeles/hyprland-borders.lua"
output_path = "~/.config/hypr/config/noctalia_colors.lua"
post_hook = "hyprctl reload"

[templates.niri_borders]
input_path = "modeles/niri-borders.kdl"
output_path = "~/.config/niri/noctalia.kdl"

[templates.menu_colors]
input_path = "modeles/menu-colors.json"
output_path = "~/.config/quickshell/menu/colors.json"

[templates.startpage_colors]
input_path = "modeles/startpage-colors.css"
output_path = "~/.config/startpage/colors.css"
